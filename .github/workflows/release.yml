name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create version PR or tag
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action only pushes tags when `changeset publish` reports
      # "New tag:" lines; the `git-tag` script leaves tags on the runner, so
      # push them explicitly.
      - name: Push git tags
        run: git push origin --tags

      # changesets/action likewise only creates GitHub releases from
      # `changeset publish` output, so create one here from the CHANGELOG
      # section of the current version when its tag has no release yet.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice ::Tag ${TAG} does not exist. Skipping GitHub release."
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Notice: release ${TAG} already exists. Skipping."
            exit 0
          fi

          awk -v ver="${VERSION}" 'BEGIN{p=0} /^## /{ if (p) exit; if ($0 == "## " ver) p=1; next } p' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md
          else
            echo "No CHANGELOG section for ${VERSION}; generating notes from commits."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
          echo "Created GitHub release ${TAG}."

      - name: Build and Publish CLI to NPM
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice ::Skipping CLI publish to npm: NPM_TOKEN secret is not configured in repository secrets."
            exit 0
          fi

          echo "Configuring npm authentication..."
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

          cd cli
          bun install --frozen-lockfile
          bun run build

          CLI_NAME=$(node -p "require('./package.json').name")
          CLI_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$CLI_NAME" version 2>/dev/null || echo "none")

          if [ "$CLI_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Notice: $CLI_NAME@$CLI_VERSION is already published on npm. Skipping publish."
          else
            echo "Publishing $CLI_NAME@$CLI_VERSION to npm..."
            npm publish --access public --provenance
            echo "Successfully published $CLI_NAME@$CLI_VERSION to npm! 🎉"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
